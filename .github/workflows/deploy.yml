name: Deploy schedule to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Cache-bust local assets
        run: |
          v="${{ github.sha }}"
          sed -i \
            -e "s/style\.css\"/style.css?v=${v}\"/" \
            -e "s/data\.js\"/data.js?v=${v}\"/" \
            -e "s/script\.js\"/script.js?v=${v}\"/" \
            index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
